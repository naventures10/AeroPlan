<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" sizes="any" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Aero Plan</title>
  </head>

  <body>
    <script>
      (function () {
        try {
          var store = localStorage.getItem('eaip-map-store');
          if (store) {
            var parsed = JSON.parse(store);
            if (parsed.state && parsed.state.mapStyle) {
              if (parsed.state.mapStyle === 'hybrid') {
                document.documentElement.style.colorScheme = '';
              } else {
                document.documentElement.style.colorScheme =
                  parsed.state.mapStyle === 'light' ? 'light' : 'dark';
              }
              return;
            }
          }
          if (window.matchMedia('(prefers-color-scheme: light)').matches) {
            document.documentElement.style.colorScheme = 'light';
          } else {
            document.documentElement.style.colorScheme = 'dark';
          }
        } catch (e) {}
      })();
    </script>
    <div
      id="placeholder"
      style="
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        background-color: #111827;
        color: white;
        font-family: sans-serif;
        user-select: none;
        z-index: 9999;
      "
    >
      <div
        style="
          width: 40px;
          height: 40px;
          border: 4px solid #374151;
          border-top-color: #10b981;
          border-radius: 50%;
          animation: spin 1s linear infinite;
          margin-bottom: 16px;
        "
      ></div>
      <p
        style="
          font-size: 14px;
          color: #9ca3af;
          animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        "
      >
        Initializing eAIP Systems...
      </p>
    </div>
    <div id="root"></div>

    <script>
      window.hideLoader = function () {
        const loader = document.getElementById('placeholder');
        if (loader) {
          loader.style.opacity = '0';
          setTimeout(() => loader.remove(), 300);
        }
      };
    </script>
    <style>
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
        }

        50% {
          opacity: 0.5;
        }
      }
    </style>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
