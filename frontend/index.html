<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>frontend</title>
  </head>
  <body>
    <div id="root">
      <div id="placeholder" style="display:flex;flex-direction:column;justify-content:center;align-items:center;height:100vh;background-color:#111827;color:white;font-family:sans-serif;user-select:none;">
        <div style="width:40px;height:40px;border:4px solid #374151;border-top-color:#10b981;border-radius:50%;animation:spin 1s linear infinite;margin-bottom:16px;"></div>
        <p style="font-size:14px;color:#9ca3af;animation:pulse 2s cubic-bezier(0.4,0,0.6,1) infinite;">Initializing eAIP Systems...</p>
      </div>
      <style>
        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .5; } }
      </style>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
