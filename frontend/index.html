  <body>
    <script>
      (function () {
        try {
          var store = localStorage.getItem('eaip-map-store');
          var isDark = false;
          if (store) {
            var parsed = JSON.parse(store);
            if (parsed.state && parsed.state.mapStyle) {
              var style = parsed.state.mapStyle;
              if (style === 'hybrid') {
                document.documentElement.style.colorScheme = '';
                isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
              } else {
                document.documentElement.style.colorScheme = style;
                isDark = style === 'dark';
              }
              document.documentElement.classList.toggle('dark', isDark);
              return;
            }
          }
          if (window.matchMedia('(prefers-color-scheme: light)').matches) {
            document.documentElement.style.colorScheme = 'light';
            document.documentElement.classList.toggle('dark', false);
          } else {
            document.documentElement.style.colorScheme = 'dark';
            document.documentElement.classList.toggle('dark', true);
          }
        } catch (e) {}
      })();
    </script>
    <div

      style="

        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        display: flex;

        justify-content: center;

          margin-bottom: 16px;
        "

          color: #9ca3af;
          animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        "
      >
        Initializing AeroInfo Systems...
      </p>
    </div>
    <div id="root"></div>

    <script>
      window.hideLoader = function () {
        const loader = document.getElementById('placeholder');
        if (loader) {
          loader.style.opacity = '0';
          setTimeout(() => loader.remove(), 300);
        }
      };
    </script>
    <style>
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
        }

        50% {
          opacity: 0.5;
        }
      }
    </style>
