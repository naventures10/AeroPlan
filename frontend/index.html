  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" sizes="any" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <link rel="preload" as="image" href="/Backdrop.jpg" fetchpriority="high" />
    <title>AeroInfo India | Interactive Aeronautical Information &amp; Airspace Platform</title>
    <meta
      name="description"
      content="AeroInfo India is an interactive digital platform for Indian airspace visualization, ATS navigation routes, real-time METAR &amp; TAF weather reports, NOTAMs, and aeronautical charts."
    />
    <meta
      name="keywords"
      content="AeroInfo India, Aeronautical Information Publication, Indian Airspace, Flight Navigation, Airspace Visualization, ATS Routes, METAR, TAF, Real-time METAR, NOTAMs"
    />
    <link rel="canonical" href="https://aeroinfo.in/" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://aeroinfo.in/" />
    <meta
      property="og:title"
      content="AeroInfo India | Interactive Aeronautical Information &amp; Airspace Platform"
    />
    <meta
      property="og:description"
      content="AeroInfo India is an interactive digital platform for Indian airspace visualization, ATS navigation routes, real-time METAR &amp; TAF weather reports, NOTAMs, and aeronautical charts."
    />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://aeroinfo.in/" />
    <meta
      name="twitter:title"
      content="AeroInfo India | Interactive Aeronautical Information &amp; Airspace Platform"
    />
    <meta
      name="twitter:description"
      content="AeroInfo India is an interactive digital platform for Indian airspace visualization, ATS navigation routes, real-time METAR &amp; TAF weather reports, NOTAMs, and aeronautical charts."
    />
    <meta name="twitter:image" content="https://aeroinfo.in/Backdrop.jpg" />

    <!-- Schema.org Structured Data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "AeroInfo India",
        "url": "https://aeroinfo.in/",
        "applicationCategory": "NavigationApplication",
        "operatingSystem": "All",
        "description": "AeroInfo India is an interactive digital platform for Indian airspace visualization, ATS navigation routes, real-time METAR & TAF weather reports, NOTAMs, and aeronautical charts.",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "INR"
        }
      }
    </script>
  </head>

  <body>
    <script>
      (function () {
        try {
          var store = localStorage.getItem('eaip-map-store');
          var isDark = false;
          if (store) {
            var parsed = JSON.parse(store);
            if (parsed.state && parsed.state.mapStyle) {
              var style = parsed.state.mapStyle;
              if (style === 'hybrid') {
                document.documentElement.style.colorScheme = '';
                isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
              } else {
                document.documentElement.style.colorScheme = style;
                isDark = style === 'dark';
              }
              document.documentElement.classList.toggle('dark', isDark);
              return;
            }
          }
          if (window.matchMedia('(prefers-color-scheme: light)').matches) {
            document.documentElement.style.colorScheme = 'light';
            document.documentElement.classList.toggle('dark', false);
          } else {
            document.documentElement.style.colorScheme = 'dark';
            document.documentElement.classList.toggle('dark', true);
          }
        } catch (e) {}
      })();
    </script>
    <div
      id="placeholder"
      style="
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        background-color: #111827;
        color: white;
        font-family: sans-serif;
        user-select: none;
        z-index: 9999;
      "
    >
      <div
        style="
          width: 40px;
          height: 40px;
          border: 4px solid #374151;
          border-top-color: #10b981;
          border-radius: 50%;
          animation: spin 1s linear infinite;
          margin-bottom: 16px;
        "
      ></div>
      <p
        style="
          font-size: 14px;
          color: #9ca3af;
          animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        "
      >
        Initializing AeroInfo Systems...
      </p>
    </div>
    <div id="root"></div>

    <script>
      window.hideLoader = function () {
        const loader = document.getElementById('placeholder');
        if (loader) {
          loader.style.opacity = '0';
          setTimeout(() => loader.remove(), 300);
        }
      };
    </script>
    <style>
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
        }

        50% {
          opacity: 0.5;
        }
      }
    </style>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
