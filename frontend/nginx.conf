# Rate Limiting & E2E Bypass mapping
map $http_x_e2e_test $limit_key {
    "true" "";
    default $binary_remote_addr;
}

# API Rate Limit Zone: 10r/s with 10M memory zone
limit_req_zone $limit_key zone=api_limit_zone:10m rate=10r/s;

# Tiles Rate Limit Zone: 50r/s with 10M memory zone
limit_req_zone $limit_key zone=tiles_limit_zone:10m rate=50r/s;

# Set rate limit status code
limit_req_status 429;

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    
    # Ensure ES modules and workers are served with correct MIME type
    include /etc/nginx/mime.types;
    types {
        application/javascript mjs;
    }
    
    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 10240;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json;
    gzip_disable "MSIE [1-6]\.";

    # Proxy /api to the backend
    location /api/ {
        limit_req zone=api_limit_zone burst=20 nodelay;
        proxy_pass ${VITE_API_URL}/api/;
        proxy_ssl_server_name on;
        proxy_set_header Host $proxy_host;
    }

    # Proxy /tiles to Martin
    location /tiles/ {
        limit_req zone=tiles_limit_zone burst=100 nodelay;
        proxy_pass ${VITE_MARTIN_URL}/;
        proxy_ssl_server_name on;
        proxy_set_header Host $proxy_host;
    }

    # Fallback routing for Single Page Application
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }
}
