<svg xmlns="http://www.w3.org/2000/svg" viewBox="1230 1530 215 185" width="32" height="32">
  <defs>
    <!-- Dynamic Theme-Adapting Gradient for Favicon -->
    <linearGradient id="aero-tricolor" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop id="stop-saffron" offset="0%" stop-color="#FF9933" />
      <stop id="stop-mid" offset="45%" stop-color="#FFFFFF" />
      <stop id="stop-cyan" offset="100%" stop-color="#5DF8D8" />
    </linearGradient>
    <style>
      /* Light Browser Tab Theme High-Contrast Color Overrides */
      @media (prefers-color-scheme: light) {
        #stop-saffron { stop-color: #F97316; }
        #stop-mid { stop-color: #314F4C; }
        #stop-cyan { stop-color: #0891B2; }
      }
    </style>
  </defs>

