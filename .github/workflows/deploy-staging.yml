name: Deploy to GCP Staging

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
    branches:
      - main

env:
  PROJECT_ID: project-d5038013-e773-4f0b-98a
  REGION: us-central1
  GAR_LOCATION: us-central1-docker.pkg.dev
  REPOSITORY: eaip-repo
  SERVICE_ACCOUNT: eaip-github-actions@project-d5038013-e773-4f0b-98a.iam.gserviceaccount.com
  WORKLOAD_IDENTITY_PROVIDER: projects/452632649441/locations/global/workloadIdentityPools/github-actions-pool/providers/github-actions-provider

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: 'read'
      id-token: 'write' # Required for Workload Identity Federation

    steps:
      - name: Checkout Code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Configure Docker to use Artifact Registry
        run: |-
          gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev

      # ── Backend ────────────────────────────────────────────────────────────

      - name: Build and Push Backend Image
        run: |-
          IMAGE="${{ env.GAR_LOCATION }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/eaip-backend:${{ github.sha }}"
          docker build -t $IMAGE ./backend
          docker push $IMAGE

      - name: Deploy Backend to Cloud Run
        run: |-
          IMAGE="${{ env.GAR_LOCATION }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/eaip-backend:${{ github.sha }}"
          gcloud run deploy eaip-backend --image $IMAGE --region ${{ env.REGION }}

      # ── Weather Pipeline (Cloud Run Job) ────────────────────────────────────

      - name: Build and Push Weather Pipeline Image
        run: |-
          IMAGE="${{ env.GAR_LOCATION }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/weather-pipeline:${{ github.sha }}"
          docker build -f backend/Dockerfile.weather -t $IMAGE ./backend
          docker push $IMAGE

      - name: Deploy Weather Pipeline Cloud Run Job
        run: |-
          IMAGE="${{ env.GAR_LOCATION }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/weather-pipeline:${{ github.sha }}"
          gcloud run jobs update weather-pipeline --image $IMAGE --region ${{ env.REGION }}

      # ── Martin Tile Server ─────────────────────────────────────────────────

      - name: Pull, Tag, and Push Martin Image to Artifact Registry
        run: |-
          MARTIN_IMAGE_SRC="ghcr.io/maplibre/martin:v0.14.2"
          MARTIN_IMAGE_DEST="${{ env.GAR_LOCATION }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/eaip-martin:v0.14.2"
          docker pull $MARTIN_IMAGE_SRC
          docker tag $MARTIN_IMAGE_SRC $MARTIN_IMAGE_DEST
          docker push $MARTIN_IMAGE_DEST

      - name: Deploy Martin Tile Server to Cloud Run
        run: |-
          IMAGE="${{ env.GAR_LOCATION }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/eaip-martin:v0.14.2"
          gcloud run deploy eaip-martin --image $IMAGE --region ${{ env.REGION }}

      # ── Frontend ───────────────────────────────────────────────────────────

      - name: Save Previous Frontend Revision
        id: prev_revision
        run: |
          REV=$(gcloud run services describe eaip-frontend --region ${{ env.REGION }} --format 'value(status.latestReadyRevisionName)' || echo "")
          echo "PREV_REV=$REV" >> $GITHUB_ENV

      - name: Build, Push, and Deploy Frontend Image
        run: |-
          # Fetch backend and martin URLs to inject into the frontend at build time
          BACKEND_URL=$(gcloud run services describe eaip-backend --region ${{ env.REGION }} --format 'value(status.url)')
          MARTIN_URL=$(gcloud run services describe eaip-martin --region ${{ env.REGION }} --format 'value(status.url)')

          IMAGE="${{ env.GAR_LOCATION }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/eaip-frontend:${{ github.sha }}"
          docker build \
            --build-arg VITE_API_URL=$BACKEND_URL \
            --build-arg VITE_MARTIN_URL=$MARTIN_URL \
            --build-arg VITE_MAPTILER_KEY=${{ secrets.VITE_MAPTILER_KEY }} \
            -t $IMAGE ./frontend
          docker push $IMAGE

          gcloud run deploy eaip-frontend --image $IMAGE --region ${{ env.REGION }}

      - name: Setup Node.js for E2E
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright Browsers
        working-directory: frontend
        run: npx playwright install --with-deps

      - name: Run E2E Smoke Tests
        working-directory: frontend
        run: npm run test:e2e
        env:
          BASE_URL: https://eaip-frontend-filscyl4bq-uc.a.run.app/app

      - name: Rollback Frontend on Failure
        if: failure()
        run: |
          if [ -n "$PREV_REV" ]; then
            echo "Rolling back to revision: $PREV_REV"
            gcloud run services update-traffic eaip-frontend --region ${{ env.REGION }} --to-revisions=$PREV_REV=100
          else
            echo "No previous revision found to rollback to."
          fi
