name: Deploy to GCP Staging

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
    branches:
      - main

env:
  PROJECT_ID: project-d5038013-e773-4f0b-98a
  REGION: us-central1
  GAR_LOCATION: us-central1-docker.pkg.dev
  REPOSITORY: eaip-repo
  SERVICE_ACCOUNT: eaip-github-actions@project-d5038013-e773-4f0b-98a.iam.gserviceaccount.com
  WORKLOAD_IDENTITY_PROVIDER: projects/452632649441/locations/global/workloadIdentityPools/github-actions-pool/providers/github-actions-provider

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: 'read'
      id-token: 'write' # Required for Workload Identity Federation

    steps:
      - name: Checkout Code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Configure Docker to use Artifact Registry
        run: |-
          gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev

      # ── Backend ────────────────────────────────────────────────────────────

      - name: Build and Push Backend Image
        run: |-
          IMAGE="${{ env.GAR_LOCATION }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/eaip-backend:${{ github.sha }}"
          docker build -t $IMAGE ./backend
          docker push $IMAGE

      - name: Build and Push Weather Pipeline Image
        run: |-
          IMAGE="${{ env.GAR_LOCATION }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/weather-pipeline:${{ github.sha }}"
          docker build -f backend/Dockerfile.weather -t $IMAGE ./backend
          docker push $IMAGE

      - name: Pull, Tag, and Push Martin Image to Artifact Registry
        run: |-
          MARTIN_IMAGE_SRC="ghcr.io/maplibre/martin:v0.14.2"
          MARTIN_IMAGE_DEST="${{ env.GAR_LOCATION }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/eaip-martin:v0.14.2"
          docker pull $MARTIN_IMAGE_SRC
          docker tag $MARTIN_IMAGE_SRC $MARTIN_IMAGE_DEST
          docker push $MARTIN_IMAGE_DEST

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.8.8

      - name: Retrieve Google access token for OpenTofu
        run: |
          GOOGLE_OAUTH_ACCESS_TOKEN=$(gcloud auth print-access-token)
          echo "GOOGLE_OAUTH_ACCESS_TOKEN=$GOOGLE_OAUTH_ACCESS_TOKEN" >> $GITHUB_ENV

      - name: Fetch Secrets from GCP Secret Manager
        id: secrets
        uses: google-github-actions/get-secretmanager-secrets@v2
        with:
          secrets: |-
            DB_PASSWORD:projects/${{ env.PROJECT_ID }}/secrets/eaip-db-password
            VITE_MAPTILER_KEY:projects/${{ env.PROJECT_ID }}/secrets/vite-maptiler-key
            VITE_FARO_URL:projects/${{ env.PROJECT_ID }}/secrets/vite-faro-url
            OTEL_ENDPOINT:projects/${{ env.PROJECT_ID }}/secrets/otel-endpoint
            OTEL_HEADERS:projects/${{ env.PROJECT_ID }}/secrets/otel-headers
            VITE_LOCK_AIP_SUPPLEMENTS:projects/${{ env.PROJECT_ID }}/secrets/vite-lock-aip-supplements
            VITE_LOCK_AERODROME_CHARTS:projects/${{ env.PROJECT_ID }}/secrets/vite-lock-aerodrome-charts

      # Run tofu apply once to ensure base infrastructure, database, secrets, and services exist
      - name: Deploy Base Infrastructure and Services
        working-directory: infra/tofu
        run: |-
          tofu init -reconfigure -backend-config="access_token=${{ env.GOOGLE_OAUTH_ACCESS_TOKEN }}"
          tofu apply -auto-approve \
            -var="db_password=${{ steps.secrets.outputs.DB_PASSWORD }}" \
            -var="vite_maptiler_key=${{ steps.secrets.outputs.VITE_MAPTILER_KEY }}" \
            -var="vite_faro_url=${{ steps.secrets.outputs.VITE_FARO_URL }}" \
            -var="otel_endpoint=${{ steps.secrets.outputs.OTEL_ENDPOINT }}" \
            -var="otel_headers=${{ steps.secrets.outputs.OTEL_HEADERS }}" \
            -var="vite_lock_aip_supplements=${{ steps.secrets.outputs.VITE_LOCK_AIP_SUPPLEMENTS }}" \
            -var="vite_lock_aerodrome_charts=${{ steps.secrets.outputs.VITE_LOCK_AERODROME_CHARTS }}"

      - name: Fetch Deployed Service URLs
        id: urls
        run: |
          BACKEND_URL=$(gcloud run services describe eaip-backend --region ${{ env.REGION }} --format 'value(status.url)')
          MARTIN_URL=$(gcloud run services describe eaip-martin --region ${{ env.REGION }} --format 'value(status.url)')
          echo "BACKEND_URL=$BACKEND_URL" >> $GITHUB_ENV
          echo "MARTIN_URL=$MARTIN_URL" >> $GITHUB_ENV

      - name: Fetch Current Frontend Revision (for rollback)
        run: |
          PREV_REV=$(gcloud run services describe eaip-frontend --region ${{ env.REGION }} --format 'value(status.latestReadyRevisionName)' || echo "")
          echo "PREV_REV=$PREV_REV" >> $GITHUB_ENV

      - name: Deploy Backend, Martin, and Job Images to Cloud Run
        run: |-
          gcloud run deploy eaip-backend \
            --image ${{ env.GAR_LOCATION }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/eaip-backend:${{ github.sha }} \
            --region ${{ env.REGION }} \
            --platform managed

          gcloud run deploy eaip-martin \
            --image ${{ env.GAR_LOCATION }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/eaip-martin:v0.14.2 \
            --region ${{ env.REGION }} \
            --platform managed

          gcloud run jobs update weather-pipeline \
            --image ${{ env.GAR_LOCATION }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/weather-pipeline:${{ github.sha }} \
            --region ${{ env.REGION }}

      - name: Build, Push, and Deploy Frontend Image
        run: |-
          IMAGE="${{ env.GAR_LOCATION }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/eaip-frontend:${{ github.sha }}"
          docker build \
            --build-arg VITE_API_URL=${{ env.BACKEND_URL }} \
            --build-arg VITE_MARTIN_URL=${{ env.MARTIN_URL }} \
            --build-arg VITE_MAPTILER_KEY=${{ steps.secrets.outputs.VITE_MAPTILER_KEY }} \
            --build-arg VITE_E2E_TEST=true \
            --build-arg VITE_FARO_URL=${{ steps.secrets.outputs.VITE_FARO_URL }} \
            --build-arg VITE_LOCK_AIP_SUPPLEMENTS=${{ steps.secrets.outputs.VITE_LOCK_AIP_SUPPLEMENTS }} \
            --build-arg VITE_LOCK_AERODROME_CHARTS=${{ steps.secrets.outputs.VITE_LOCK_AERODROME_CHARTS }} \
            -t $IMAGE ./frontend
          docker push $IMAGE

      - name: Deploy Frontend to Cloud Run
        run: |-
          gcloud run deploy eaip-frontend \
            --image ${{ env.GAR_LOCATION }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/eaip-frontend:${{ github.sha }} \
            --region ${{ env.REGION }} \
            --platform managed



      - name: Setup Node.js for E2E
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright Browsers
        working-directory: frontend
        run: npx playwright install --with-deps

      - name: Fetch Deployed Frontend URL
        id: frontend_url
        run: |
          FRONTEND_URL=$(gcloud run services describe eaip-frontend --region ${{ env.REGION }} --format 'value(status.url)')
          echo "FRONTEND_URL=$FRONTEND_URL" >> $GITHUB_OUTPUT
          echo "Frontend URL: $FRONTEND_URL"

      - name: Warm Up Cloud Run Services
        run: |
          FRONTEND_URL="${{ steps.frontend_url.outputs.FRONTEND_URL }}"

          echo "Warming up backend via frontend proxy..."
          for i in 1 2 3; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "$FRONTEND_URL/api/v1/health" || echo "000")
            echo "  Attempt $i: HTTP $STATUS"
            if [ "$STATUS" = "200" ]; then
              echo "Backend is warm."
              break
            fi
            sleep 5
          done

          echo "Warming up search endpoint..."
          curl -s --max-time 30 "$FRONTEND_URL/api/v1/search?q=Delhi" > /dev/null || true

          echo "Warm-up complete."

      - name: Run E2E Smoke Tests
        working-directory: frontend
        run: npx playwright test src/tests/e2e/auth.spec.ts src/tests/e2e/enroute-view.spec.ts src/tests/e2e/ats-route-workflow.spec.ts --project=chromium --grep-invert "User Story 4.1"
        env:
          BASE_URL: ${{ steps.frontend_url.outputs.FRONTEND_URL }}

      - name: Rollback Frontend on Failure
        if: failure()
        run: |
          if [ -n "$PREV_REV" ]; then
            echo "Rolling back to revision: $PREV_REV"
            gcloud run services update-traffic eaip-frontend --region ${{ env.REGION }} --to-revisions=$PREV_REV=100
          else
            echo "No previous revision found to rollback to."
          fi
