[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = "==3.13.*"
dependencies = [
    "asyncpg>=0.31.0",
    "beautifulsoup4>=4.12.0",
    "boto3>=1.42.63",
    "fastapi>=0.135.1",
    "geoalchemy2>=0.18.4",
    "geopandas>=1.1.3",
    "greenlet>=3.3.2",
    "httpx>=0.28.1",
    "matplotlib>=3.10.9",
    "psycopg2-binary>=2.9.12",
    "psycopg[binary]>=3.3.3",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.13.1",


    "python-dotenv>=1.0.0",
    "sqlalchemy>=2.0.48",
    "structlog>=25.5.0",
    "uvicorn[standard]>=0.41.0",
    "email-validator>=2.3.0",

    "opentelemetry-api>=1.42.1",
    "opentelemetry-sdk>=1.42.1",
    "opentelemetry-instrumentation-fastapi>=0.63b1",
    "opentelemetry-instrumentation-logging>=0.63b1",
    "opentelemetry-instrumentation-sqlalchemy>=0.63b1",
    "opentelemetry-exporter-otlp-proto-http>=1.42.1",
    "cfgrib>=0.9.15.1",
    "ecmwf-opendata>=0.3.29",
    "rasterio>=1.5.0",
    "xarray>=2026.4.0",
    "google-cloud-storage>=3.10.1",
    "anyio>=4.12.1",
    "botocore>=1.42.63",
    "requests>=2.33.1",
    "urllib3>=2.6.3",
    "numpy>=2.4.4",
    "scipy>=1.17.1",
    "redis>=5.0.1",
    "slowapi>=0.1.10",
]

[dependency-groups]
dev = [
    "pyrefly",
    "pytest>=8.3.5",
    "pytest-asyncio>=0.25.3",
    "pytest-cov>=6.0.0",
    "ruff>=0.9.10",
    "vulture>=2.14",
    "deptry>=0.23.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
pythonpath = ["."]
markers = [
    "data_integrity: Audit test for real database data (skipped in clean CI)",
]


[tool.coverage.run]
omit = []

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = ["B008", "RUF012", "E501"]

[tool.vulture]
exclude = [".venv"]
make_whitelist = true
min_confidence = 80
paths = ["."]
ignore_names = ["exc_tb", "exc_type", "exc_val", "method_name", "mock_run"]

[tool.deptry.per_rule_ignores]
DEP002 = ["uvicorn", "psycopg-binary", "psycopg2-binary", "greenlet", "python-dotenv", "pydantic-settings", "asyncpg", "psycopg", "email-validator", "scipy"]
