[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "asyncpg>=0.31.0",
    "beautifulsoup4>=4.12.0",
    "boto3>=1.42.63",
    "cfgrib>=0.9.13",
    "ecmwf-opendata>=0.3.29",
    "fastapi>=0.135.1",
    "geoalchemy2>=0.18.4",
    "geopandas>=1.1.3",
    "greenlet>=3.3.2",
    "httpx>=0.28.1",
    "joblib>=1.5.3",
    "matplotlib>=3.10.9",
    "opentelemetry-api>=1.41.0",
    "opentelemetry-exporter-otlp-proto-http>=1.41.0",
    "opentelemetry-instrumentation-fastapi>=0.62b0",
    "opentelemetry-instrumentation-httpx>=0.62b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.62b0",
    "opentelemetry-sdk>=1.41.0",
    "psycopg2-binary>=2.9.12",
    "psycopg[binary]>=3.3.3",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.13.1",
    "pyogrio>=0.12.1",
    "python-dotenv>=1.0.0",
    "rasterio>=1.3.10",
    "scikit-learn>=1.8.0",
    "scipy>=1.13.0",
    "shapely>=2.1.2",
    "sqlalchemy>=2.0.48",
    "structlog>=25.5.0",
    "uvicorn[standard]>=0.41.0",
    "xarray>=2024.3.0",
]

[dependency-groups]
dev = [
    "pyrefly",
    "pytest>=8.3.5",
    "pytest-asyncio>=0.25.3",
    "pytest-cov>=6.0.0",
    "ruff>=0.9.10",
    "yappi>=1.7.6",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
pythonpath = ["."]
markers = [
    "data_integrity: Audit test for real database data (skipped in clean CI)",
]
filterwarnings = [
    "ignore:datetime.datetime.utcnow\\(\\) is deprecated:DeprecationWarning:ecmwf.opendata.date",
]

[tool.coverage.run]
omit = [
    "app/core/profiling.py"
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = ["B008", "RUF012", "E501"]



