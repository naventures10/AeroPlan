server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
- job_name: system
  static_configs:
  - targets:
      - localhost
    labels:
      job: varlogs
      __path__: /var/log/*log

- job_name: docker
  docker_sd_configs:
    - host: unix:///var/run/docker.sock
      refresh_interval: 5s
  relabel_configs:
    - source_labels: ['__meta_docker_container_name']
      regex: '/(.*)'
      target_label: 'container'
    - source_labels: ['__meta_docker_container_label_logging_jobname']
      target_label: 'job'
  pipeline_stages:
    - docker: {}
    - drop:
        older_than: 24h
        drop_counter_reason: "too_old"
    - match:
        selector: '{container="eaip-backend"}'
        stages:
          - json:
              expressions:
                level: level
                message: event
                trace_id: trace_id
                span_id: span_id
          - labels:
              level:

- job_name: local_backend
  static_configs:
  - targets:
      - localhost
    labels:
      job: local_backend
      container: eaip-backend
      __path__: /var/log/backend/*.log
  pipeline_stages:
    - json:
        expressions:
          level: level
          message: event
          trace_id: trace_id
          span_id: span_id
    - labels:
        level:
