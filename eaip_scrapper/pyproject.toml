[project]
name = "eaip-scraper"
version = "0.1.0"
description = "eAIP Scraper"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "beautifulsoup4>=4.14.3",
    "boto3>=1.42.59",
    "deepeval>=3.9.5",
    "fiona>=1.10.1",
    "geoalchemy>=0.7.2",
    "geoalchemy2>=0.18.4",
    "geopandas>=1.1.2",
    "google-generativeai>=0.8.6",
    "joblib>=1.4.2",
    "langchain-google-genai>=4.2.1",
    "llama-cloud>=1.6.0",
    "mlx>=0.31.1",
    "mlx-lm>=0.29.1",
    "mlx-vlm>=0.3.9",
    "numpy>=2.2.3",
    "pdfplumber>=0.11.9",
    "psycopg2-binary>=2.9.11",
    "pydantic-ai>=1.61.0",
    "pypdf>=6.9.1",
    "pypdf2<3.0.0",
    "python-dotenv>=1.2.2",
    "requests>=2.32.5",
    "scipy>=1.15.2",
    "shapely>=2.0.7",
    "sqlalchemy>=2.0.48",
    "urllib3>=2.6.3",
]

[dependency-groups]
dev = [
    "pmtiles>=3.7.0",
    "pyrefly",
    "pytest>=8.3.5",
    "pytest-cov>=6.0.0",
    "ruff>=0.15.13",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
pythonpath = ["."]
markers = [
    "data_integrity: Audit test for real database data (skipped in clean CI)",
]

[tool.coverage.run]
omit = []

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = ["B008", "RUF012", "E501", "N999", "RUF001", "RUF002", "N806", "RUF003", "SIM115", "SIM102"]
